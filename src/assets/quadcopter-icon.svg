<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Quadcopter body (center) -->
  <rect x="13" y="13" width="6" height="6" fill="#333" stroke="#000" stroke-width="1"/>
  
  <!-- Motor arms -->
  <line x1="16" y1="13" x2="16" y2="4" stroke="#333" stroke-width="2"/>
  <line x1="16" y1="19" x2="16" y2="28" stroke="#333" stroke-width="2"/>
  <line x1="13" y1="16" x2="4" y2="16" stroke="#333" stroke-width="2"/>
  <line x1="19" y1="16" x2="28" y2="16" stroke="#333" stroke-width="2"/>
  
  <!-- Propellers -->
  <ellipse cx="16" cy="4" rx="4" ry="1.5" fill="#666" stroke="#000" stroke-width="0.5"/>
  <ellipse cx="16" cy="28" rx="4" ry="1.5" fill="#666" stroke="#000" stroke-width="0.5"/>
  <ellipse cx="4" cy="16" rx="1.5" ry="4" fill="#666" stroke="#000" stroke-width="0.5"/>
  <ellipse cx="28" cy="16" rx="1.5" ry="4" fill="#666" stroke="#000" stroke-width="0.5"/>
  
  <!-- Center dot for orientation -->
  <circle cx="16" cy="16" r="2" fill="#ff0000"/>
</svg>
